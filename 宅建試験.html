<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅建試験サポートアプリ</title>
<style>
    :root {
        /* デフォルトは権利関係のカラー */
        --primary: #2563eb;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --correct: #16a34a;
        --incorrect: #dc2626;
    }
    body {
        font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.6;
        margin: 0;
        padding: 20px;
        transition: background-color 0.3s;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
        text-align: center;
        color: var(--primary);
        font-size: 1.5rem;
    }
    .progress {
        text-align: right;
        font-weight: bold;
        color: #64748b;
        margin-bottom: 20px;
    }
    .question-text {
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e2e8f0;
    }
    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .option-btn {
        padding: 15px;
        font-size: 1rem;
        text-align: left;
        background-color: #f1f5f9;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .option-btn:hover:not(:disabled) {
        background-color: #e2e8f0;
        border-color: #cbd5e1;
    }
    .option-btn:disabled {
        cursor: default;
    }
    .option-btn.correct {
        background-color: #dcfce7;
        border-color: var(--correct);
        color: #14532d;
    }
    .option-btn.incorrect {
        background-color: #fee2e2;
        border-color: var(--incorrect);
        color: #7f1d1d;
    }
    .explanation-area {
        margin-top: 25px;
        padding: 20px;
        border-radius: 8px;
        display: none;
    }
    .explanation-area.show {
        display: block;
        animation: fadeIn 0.3s;
    }
    .explanation-title {
        font-weight: bold;
        margin-bottom: 10px;
    }
    .explanation-title.correct-text { color: var(--correct); }
    .explanation-title.incorrect-text { color: var(--incorrect); }
    
    .next-btn, .start-btn, .menu-btn {
        display: block;
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
    }
    .next-btn:hover, .start-btn:hover {
        opacity: 0.9;
    }

    /* メニュー画面用ボタン */
    .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 30px;
    }
    .menu-btn { margin-top: 0; }
    .menu-btn:hover { opacity: 0.9; }
    .btn-rights { background-color: #2563eb; }
    .btn-brokerage { background-color: #1e3a8a; }
    .btn-legal { background-color: #0f766e; }
    
    .home-btn {
        background-color: #64748b;
        margin-top: 15px;
    }
    .home-btn:hover { background-color: #475569; }

    #quiz-screen, #result-screen {
        display: none;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="container">
    <!-- トップメニュー画面 -->
    <div id="home-screen">
        <h1 style="color: #333;">宅建試験サポートアプリ</h1>
        <p style="text-align: center;">学習したい分野を選んでください。<br>各分野の重要トラップ30問の中から、ランダムに10問が出題されます。</p>
        <div class="menu-buttons">
            <button class="menu-btn btn-rights" onclick="startQuiz('rights')">権利関係ドリルに挑戦 (全30問)</button>
            <button class="menu-btn btn-brokerage" onclick="startQuiz('brokerage')">宅建業法ドリルに挑戦 (全30問)</button>
            <button class="menu-btn btn-legal" onclick="startQuiz('legal')">法令上の制限ドリルに挑戦 (全30問)</button>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen">
        <h1 id="quiz-title"></h1>
        <div class="progress" id="progress-text">第 1 問 / 10</div>
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options-container"></div>

        <div class="explanation-area" id="explanation-area">
            <div class="explanation-title" id="explanation-title"></div>
            <div id="explanation-text"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen">
        <h1>結果発表</h1>
        <h2 style="text-align: center; font-size: 2rem;" id="score-text"></h2>
        <p id="feedback-text" style="text-align: center; font-weight: bold;"></p>
        <button class="start-btn" onclick="retryQuiz()">同じ分野でもう一度挑戦する</button>
        <button class="home-btn" onclick="goHome()">トップメニューに戻る</button>
    </div>
</div>

<script>
// 各分野のクイズデータを統合
const appData = {
    rights: {
        title: "宅建 権利関係 弱点克服ドリル",
        primary: "#2563eb",
        bg: "#f8fafc",
        questions: [
            { q: "【制限行為能力者】成年被後見人が、成年後見人の事前の同意を得て行った不動産の売却契約は、取り消すことができるか。", options: ["取り消すことができない。", "成年後見人は取り消せるが、本人は取り消せない。", "本人も成年後見人も取り消すことができる。", "相手方が悪意の場合に限り取り消すことができる。"], answer: 2, exp: "<b>【ひっかけ：同意権の有無】</b><br>成年被後見人は常に判断能力が欠けている状態とされるため、成年後見人には「同意権」がありません（同意しても本人がトチ狂う可能性があるため）。よって、事前に同意があっても、日用品の購入等を除き契約は取り消せます。" },
            { q: "【虚偽表示】AとBが通謀して土地をBに仮装譲渡し、Bが善意のCに売却した。その後Cが悪意のDに売却した場合、AはDに無効を主張できるか。", options: ["Dは悪意なので無効を主張できる。", "Cが善意なので、Dが悪意でもAは無効を主張できない。", "Dが登記を備えていなければ無効を主張できる。", "AはCには対抗できないが、Dには対抗できる。"], answer: 1, exp: "<b>【ひっかけ：善意者の盾】</b><br>虚偽表示の無効は「善意の第三者（C）」に対抗できません。一度善意の第三者が間に入れば、その後の転得者（D）が悪意であってもDは有効に権利を取得します（善意者の盾）。" },
            { q: "【取得時効】Aが占有開始時に「善意無過失」で他人の土地を占有し始めたが、5年後に自分の土地ではないと気づいた（悪意になった）。時効完成は何年か。", options: ["占有開始から10年", "悪意になった時から10年", "占有開始から20年", "悪意になった時から20年"], answer: 0, exp: "<b>【ひっかけ：基準は占有開始時のみ】</b><br>時効取得の期間（10年か20年か）の判断は、<b>「占有を開始した時点」</b>の状態で決まります。途中で他人の土地だと知っても、開始時に善意無過失であれば10年で時効が完成します。" },
            { q: "【手付解除】売買契約で買主Aが手付を交付した。A自身は履行に着手しているが、売主Bはまだ履行に着手していない。Aは手付を放棄して解除できるか。", options: ["A自身が着手しているので解除できない。", "相手方Bが着手していないため、Aは解除できる。", "Bの承諾があれば解除できる。", "特約がない限り、いかなる場合も解除できない。"], answer: 1, exp: "<b>【ひっかけ：主語は『相手方』】</b><br>手付解除ができるのは「<b>相手方</b>が履行に着手するまで」です。自分自身が着手していても、相手方がまだなら手付を放棄して解除可能です。" },
            { q: "【連帯保証】Aの借金についてCが連帯保証人となった。債権者BがCに全額の支払いを求めた場合、Cが主張できる権利はどれか。", options: ["まず主債務者Aに請求しろと言える（催告の抗弁権）。", "Aの財産から先に差し押さえろと言える（検索の抗弁権）。", "自分の負担分（半額）しか払わないと言える（分別の利益）。", "催告の抗弁権、検索の抗弁権、分別の利益のいずれも主張できない。"], answer: 3, exp: "<b>【ひっかけ：連帯保証の重さ】</b><br>「連帯保証人」には、普通の保証人に認められる催告・検索の抗弁権、分別の利益が<b>一切ありません</b>。実務でも非常によく出る、連帯保証人の責任の重さを問う定番問題です。" },
            { q: "【法定地上権】A所有の土地と建物があり、土地だけに抵当権が設定された。その後、建物がBに売却された。抵当権が実行され土地がCに競売された場合、法定地上権は成立するか。", options: ["競売時に所有者が異なるため成立しない。", "抵当権設定時に同一所有者だったため成立する。", "Bが善意の場合に限り成立する。", "Cが承諾した場合に限り成立する。"], answer: 1, exp: "<b>【ひっかけ：判断の基準時】</b><br>法定地上権の要件である土地建物の同一所有は、<b>「抵当権設定時」</b>を基準にします。設定時に同一（A所有）であれば、その後競売までに建物が他人に売られても法定地上権は成立します。" },
            { q: "【普通借地権】借地権の存続期間を「20年」と定めて契約した場合、この期間の定めはどうなるか。", options: ["契約通り20年として有効。", "無効となり、期間の定めのない契約になる。", "強行規定により自動的に30年となる。", "強行規定により自動的に50年となる。"], answer: 2, exp: "<b>【ひっかけ：借地人に不利な特約】</b><br>普通借地権の最短期間は「30年」です。これより短い期間を定めた場合は無効となり、借地借家法の規定通り自動的に<b>30年</b>になります。" },
            { q: "【相続・遺留分】Aが死亡し、相続人は配偶者Bと、Aの兄Cのみ。「愛人に全財産を譲る」という遺言があった場合、Cの遺留分はどうなるか。", options: ["全財産の4分の1", "全財産の8分の1", "Cには遺留分がない。", "Bと等しく4分の1"], answer: 2, exp: "<b>【ひっかけ：兄弟姉妹の権利】</b><br><b>兄弟姉妹（およびその代襲相続人）には遺留分がありません。</b>どれだけ不条理な遺言であっても、兄Cは遺留分を主張して取り戻すことはできません。超頻出です。" },
            { q: "【共有】A、B、Cが各3分の1の持分で土地を共有している。この土地に「大規模な修繕（管理行為）」を行う場合、どのような決定が必要か。", options: ["各共有者が単独でできる。", "持分の過半数（2人以上の賛成）で決する。", "共有者全員の同意が必要。", "裁判所の許可が必要。"], answer: 1, exp: "<b>【ひっかけ：行為の種類と要件】</b><br>保存行為（現状維持）は「単独」、管理行為（利用・改良・修繕）は「持分の過半数」、変更・処分行為は「全員の同意」が必要です。今回は管理行為なので過半数です。" },
            { q: "【委任】民法上の委任契約において、無報酬（タダ）で引き受けた受任者が負う注意義務はどれか。", options: ["自己の財産に対するのと同一の注意義務", "善良な管理者の注意義務（善管注意義務）", "注意義務は一切負わない。", "故意がある場合のみ責任を負う注意義務"], answer: 1, exp: "<b>【ひっかけ：無報酬でもプロの責任】</b><br>民法上、委任契約の受任者は<b>有償・無償を問わず</b>、常に「善管注意義務（重い注意義務）」を負います。タダだからといって手を抜くことは許されません。" },
            { q: "【不法行為】従業員Bが仕事中にCに損害を与え、会社Aが使用者責任としてCに全額賠償した。AはBに対して全額を当然に求償（請求）できるか。", options: ["当然に全額を求償できる。", "損害の公平な分担という見地から、信義則上相当と認められる限度でのみ求償できる。", "Bに故意がない限り、一切求償できない。", "求償は一切認められない。"], answer: 1, exp: "<b>【ひっかけ：求償権の制限】</b><br>判例上、会社が身代わりに払ったからといって、従業員に全額をそのまま請求することはできません。労働環境などを考慮し、エグい過失がない限り「相当と認められる一部」に制限されます。" },
            { q: "【物権変動】AがBに土地を売却（登記未了）した後、Cにも同じ土地を二重に売却し、Cが先に登記を備えた。Cが「単なる悪意者（事情を知っているだけ）」の場合、BはCに勝てるか。", options: ["Cは悪意なので、Bは登記がなくても勝てる。", "Cが先に登記を備えているため、Bは勝てない（Cが所有権を得る）。", "契約の日付が早いBが勝つ。", "双方の話し合いで決まる。"], answer: 1, exp: "<b>【ひっかけ：悪意者 vs 背信的悪意者】</b><br>不動産の二重譲渡は「先に登記を備えた方」の勝ちです。相手が単に「先に買い手がいることを知っている（悪意）」だけなら、登記を先にしたCの勝ちです。信義則に反するほど悪質な「背信的悪意者」でない限り、登記が絶対です。" },
            { q: "【抵当権】主債務者、保証人、連帯保証人は、抵当権消滅請求をすることができるか。", options: ["全員することができる。", "主債務者はできないが、保証人はできる。", "主債務者も保証人も、誰もすることができない。", "連帯保証人のみができる。"], answer: 2, exp: "<b>【ひっかけ：消滅請求ができる人】</b><br>抵当権消滅請求は、抵当不動産を後から買った「第三取得者」を保護する制度です。そもそも借金を返す義務がある「主債務者」や「保証人」は、この制度を使って都合よく抵当権を消すことはできません。" },
            { q: "【借地借家法】建物の賃貸人（大家）が更新を拒絶するための「正当事由」について、建物の老朽化による立ち退きを求める場合、それだけで常に正当事由となるか。", options: ["老朽化があれば常に正当事由となる。", "老朽化に加え、立ち退き料の提供などを総合的に考慮して判断される。", "立ち退き料さえ払えば、老朽化していなくても常に正当事由となる。", "借主が合意しない限り、正当事由にはならない。"], answer: 1, exp: "<b>【ひっかけ：正当事由の補完】</b><br>建物の老朽化（客観的事情）だけで即座に正当事由が認められるわけではありません。足りない分を「立ち退き料（財産上の給付）」を出すことで補い、総合的に判断されます。" },
            { q: "【契約不適合責任】売買された家屋の品質に欠陥（契約不適合）があった。買主が売主に責任追及するためには、不適合を「知った時」から何年以内に「通知」しなければならないか。", options: ["6ヶ月以内", "1年以内", "2年以内", "5年以内"], answer: 1, exp: "<b>【ひっかけ：通知の期間制限】</b><br>「品質・種類」の不適合については、買主は<b>知った時から1年以内</b>に売主にその旨を「通知」する必要があります。なお、「数量」や「権利」の不適合にはこの1年の制限はありません。" },
            { q: "【意思表示】Aが売る気もないのに「土地をあげる」とBに言い（心裡留保）、BはAの本心を知っていた（悪意）。この契約の効力はどうなるか。", options: ["Aが冗談で言っただけなので常に無効。", "Bが本心を知っていた（悪意）ため、契約は無効となる。", "言葉に出した以上、Bが知っていても契約は有効。", "Aに取り消す権利が与えられる。"], answer: 1, exp: "<b>【ひっかけ：心裡留保の原則と例外】</b><br>心裡留保（冗談）は原則「有効」ですが、相手方がその本心を知っていた（悪意）か、知ることができた（有過失）場合は<b>無効</b>になります。実務の契約でも意思の合致が基本です。" },
            { q: "【錯誤】Aが重大な勘違い（錯誤）をして契約を結んだ。Aに「重大な過失（重過失）」があった場合、Aは錯誤による取消を主張できるか。", options: ["重過失があっても常に取消を主張できる。", "原則として取消を主張できない。", "相手方が善意であれば取消を主張できる。", "重過失があれば無条件で契約は無効となる。"], answer: 1, exp: "<b>【ひっかけ：重過失がある場合の制限】</b><br>錯誤による意思表示は取り消すことができますが、表意者（本人）に「重大な過失」があった場合は、原則として<b>取り消すことができなくなります</b>（相手方が本人の勘違いを知っていた場合などを除く）。" },
            { q: "【代理】Aから土地売却の代理権を与えられたBが、自らが買主となって契約（自己契約）を結んだ。この契約の効力はどうなるか。", options: ["Bは代理人なので、当然に有効な契約となる。", "原則として、本人の承諾がない限り「無権代理行為」とみなされる。", "常に当然無効となる。", "Aは取り消すことができるが、最初から無効ではない。"], answer: 1, exp: "<b>【ひっかけ：自己契約・双方代理】</b><br>本人に損害を与える恐れがあるため、自己契約や双方代理は原則として禁止されており、これに違反した行為は<b>「無権代理行為（本人が追認しない限り効果が出ない）」</b>となります。" },
            { q: "【無権代理】親Aの土地を、子が勝手に代理人と名乗って売却（無権代理）した。その後、親Aが死亡し、この無権代理人である子が単独でAを相続した場合、売買契約はどうなるか。", options: ["相続しても、無権代理なので売買は当然に無効。", "子が本人（親）の立場を相続したため、契約は当然に有効（拒絶できない）となる。", "他のみんなの同意があれば有効になる。", "子が相続を放棄すれば有効になる。"], answer: 1, exp: "<b>【ひっかけ：無権代理と相続】</b><br>無権代理人が本人を「単独相続」した場合、自分が勝手にやった契約を「俺は親の立場を受け継いだから拒絶する」と言うのは信義則上許されません。よって、契約は当然に有効となります。" },
            { q: "【消滅時効】一般的な債権（例：売掛金や貸付金）の消滅時効は、債権者が権利を行使できることを「知った時」から何年間行使しないときに完成するか。", options: ["2年間", "3年間", "5年間", "10年間"], answer: 2, exp: "<b>【ひっかけ：知った時からの期間】</b><br>民法改正により、債権の消滅時効は「権利を行使できることを<b>知った時から5年間</b>」、または「権利を行使できる時から10年間」のいずれか早い方で完成します。" },
            { q: "【物権変動と詐欺】AがBに騙されて土地を売却し、Bがその土地を善意無過失のCに転売した。AがBとの契約を「詐欺」を理由に取り消した場合、AはCから土地を取り戻せるか。", options: ["取り消せば最初から無効なので、Aは登記がなくてもCから取り戻せる。", "Cが善意無過失の第三者であるため、AはCから土地を取り戻せない。", "Cが先に登記を備えていなければ取り戻せる。", "Bの告訴が成立すれば取り戻せる。"], answer: 1, exp: "<b>【ひっかけ：詐欺取消と第三者】</b><br>詐欺による意思表示の取消は、<b>「善意でかつ過失がない第三者」に対抗できません</b>。強迫（脅された）の場合は善意の第三者にも対抗できますが、詐欺の場合は騙された側にも落ち度があるため、善意無過失のCが守られます。" },
            { q: "【抵当権・物上代位】AがBの建物に抵当権を設定していたが、その建物が火災で焼失し、Bに火災保険金が支払われることになった。Aがこの保険金から優先弁済を受ける（物上代位）ための要件はどれか。", options: ["保険金がBに「払渡される前」に差し押さえなければならない。", "Bに保険金が支払われた「後」に請求すればよい。", "特約がない限り、火災保険金には物上代位できない。", "建物の所有者がAに変更されていなければならない。"], answer: 0, exp: "<b>【ひっかけ：差し押さえのタイミング】</b><br>火災保険金や売却賃料などの「身代わり（価値変形物）」に突っ込んでいく物上代位は、対象がBの他の財産と混ざってしまうのを防ぐため、<b>「払渡しまたは引渡しの前に差し押さえる」</b>必要があります。" },
            { q: "【連帯債務】AとBが連帯してCから300万円を借りた。CがAに対して「債務の免除（返さなくていいよ）」をした場合、Bの債務はどうなるか。", options: ["Bも全額（300万円）免除される。", "Bの債務も、Aの負担部分（150万円）だけ減額される。", "Aの免除はBに影響を与えず、Bは300万円全額の債務を負う。", "契約自体が初めからなかったことになる。"], answer: 2, exp: "<b>【ひっかけ：改正民法・免除の相対効】</b><br>民法改正により、連帯債務者の一人に対する「免除」は、他の債務者に影響を与えない<b>「相対効」</b>となりました。したがって、Aが免除されても、Bは300万円全額を返す義務を負い続けます（超重要ひっかけ）。" },
            { q: "【債権譲渡】AがBに対して持つ債権をCに譲渡した。債権に「譲渡制限の特約」がついていた場合、この譲渡の効力はどうなるか。", options: ["特約に違反しているため、譲渡は当然に無効となる。", "特約があっても債権譲渡自体は「有効」に成立する。", "Bの事前の承諾がない限り、無効となる。", "Cが悪意の場合のみ、譲渡が最初から無効となる。"], answer: 1, exp: "<b>【ひっかけ：改正民法・譲渡制限特約】</b><br>こちらも大改正ポイント。譲渡制限特約があっても、<b>債権譲渡の効力は妨げられず、有効</b>となります。ただし、譲受人Cが特約について悪意（または重過失）の場合、債務者BはCからの支払請求を拒むことができます。" },
            { q: "【賃貸借・転貸借】賃貸人Aが賃借人Bに家を貸し、BがAの承諾を得てCに転貸した。その後、AとBが賃貸借契約を「合意解除」した場合、Aは転借人Cに明け渡しを請求できるか。", options: ["合意解除されたため、Aは当然にCに明渡請求できる。", "AはCに対して、合意解除をもって対抗（明渡請求）できない。", "Cが承諾した場合に限り、明渡請求できる。", "Bが立ち退き料をCに支払っていれば対抗できる。"], answer: 1, exp: "<b>【ひっかけ：合意解除と転借人の保護】</b><br>適法に転貸（サブリース）されている場合、AとBが話し合って勝手に「合意解除」しても、それによって転借人Cの権利を消すことはできません。ただし、Bの「債務不履行（家賃滞納）」による解除なら、AはCに対抗（明渡請求）できます。" },
            { q: "【敷金】建物の賃貸借契約中、賃貸人（大家）がAからBに交代した（建物の売却などによる地位の移転）。敷金に関する権利義務は誰に引き継がれるか。", options: ["特約がない限り、前の大家Aに残り、新大家Bには引き継がれない。", "当然に新大家Bに全額引き継がれる。", "AとBで半額ずつ分担する。", "賃借人の承諾がない限り、引き継がれない。"], answer: 1, exp: "<b>【ひっかけ：賃貸人交代に伴う敷金の承継】</b><br>建物の所有権が移転し、大家の立場がBに代わった場合、それまで預けられていた敷金に関する権利義務は、<b>当然に新所有者Bにそのまま引き継がれます</b>。賃借人は退去時、新大家Bに敷金返還を請求します。" },
            { q: "【定期借地権】公正証書の作成が「絶対の要件（作成しないと無効）」と定められている定期借地権はどれか。", options: ["一般定期借地権", "事業用定期借地権", "建物譲渡特約付借地権", "すべての定期借地権"], answer: 1, exp: "<b>【ひっかけ：書面の種類】</b><br>一般定期借地権は「公正証書『等の書面』」で足りる（普通の契約書でもOK）のに対し、<b>「事業用定期借地権」は必ず【公正証書】で契約しなければ無効</b>になります。この違いは試験で非常に突かれます。" },
            { q: "【定期借家契約】期間の定めのある定期建物賃貸借（定期借家）契約を結ぶ際、書面の交付とは別に大家が行わなければならない義務はどれか。", options: ["事前に「契約の更新がなく、期間満了で終了する」旨を記載した書面を交付して説明すること。", "宅地建物取引士による重要事項説明を行わせること。", "公証役場へ届け出ること。", "特段の事前手続きは不要。"], answer: 0, exp: "<b>【ひっかけ：定期借家の事前説明義務】</b><br>定期借家契約を有効に成立させるには、契約書とは別に、あらかじめ「更新がない」という独立した書面を渡して説明しなければなりません。これを怠ると、普通の「更新がある借家契約」になってしまいます。" },
            { q: "【区分所有法】マンションの「規約の変更」を行う場合、集会においてどのくらいの議決権および区分所有者の賛成が必要か。", options: ["過半数（2分の1超）", "4分の3以上", "5分の4以上", "全員の合意"], answer: 1, exp: "<b>【ひっかけ：決議要件の数字】</b><br>規約の変更、管理組合の法人化、大規模復旧などは<b>「4分の3以上」</b>の多数決が必要です。なお、最も重い「建替え決議」は<b>「5分の4以上」</b>となります。数字のひっかけに注意しましょう。" },
            { q: "【相続・法定相続分】Aが死亡し、相続人が「配偶者」と、Aの「母親（直系尊属）」の2人である場合、それぞれの法定相続分の組み合わせとして正しいものはどれか。", options: ["配偶者 1/2、 母親 1/2", "配偶者 2/3、 母親 1/3", "配偶者 3/4、 母親 1/4", "配偶者 1/3、 母親 2/3"], answer: 1, exp: "<b>【ひっかけ：相続人の組み合わせによる割合】</b><br>配偶者と「子供」なら【1/2ずつ】、配偶者と「親（直系尊属）」なら【配偶者2/3、親1/3】、配偶者と「兄弟姉妹」なら【配偶者3/4、兄弟1/4】となります。組み合わせをしっかり頭に叩き込みましょう。" }
        ]
    },
    brokerage: {
        title: "宅建 宅建業法 弱点克服ドリル",
        primary: "#1e3a8a",
        bg: "#eff6ff",
        questions: [
            { q: "【宅建業の定義】Aが自ら所有するビルの一室を、複数のテナントに定期的に賃貸し、その管理を自ら行う行為は、宅地建物取引業の免許が必要か。", options: ["不特定多数に賃貸しているため、免許が必要である。", "賃貸行為は「売買・交換」ではないが「媒介」にあたるため、免許が必要である。", "自ら賃貸（大家業）およびその管理行為は、宅建業の定義に含まれないため、免許は不要である。", "転貸（サブリース）でなければ免許が必要である。"], answer: 2, exp: "<b>【ひっかけ：自ら賃貸は業ではない】</b><br>超・超頻出トラップです。宅建業にあたるのは、宅地建物の「売買」「交換」、またはそれらの「代理」「媒介」、および貸借の「代理」「媒介」です。<b>「自ら賃貸（大家業）」は取引の類型にそもそも含まれない</b>ため、規模がどれだけ大きくても免許は一切不要です。" },
            { q: "【宅建業の定義】破産管財人が、破産財団の清算のために、複数回にわたり宅地建物の売買を反復継続して行う場合、免許が必要か。", options: ["反復継続して売買を行うため、免許が必要である。", "裁判所の監督下で行う清算業務であるため、免許は不要である。", "破産管財人が宅建業者である場合のみ免除される。", "事前に知事の許可を受ければ不要である。"], answer: 1, exp: "<b>【ひっかけ：国や裁判所機関の特例】</b><br>破産管財人が行う清算業務としての不動産売買は、裁判所の監督下で行われるため、「業」には該当せず、免許は不要です。また、地方公共団体や信託会社なども免許不要の特例があります。" },
            { q: "【免許の基準】法人の役員の中に、刑法第204条の「傷害罪」により「罰金刑」に処せられた者がいる場合、その法人は宅建業の免許を受けることができるか。", options: ["罰金刑であれば、何の罪であっても免許を受けることができる。", "傷害罪の罰金刑は執行終了から5年を経過しなければ、法人は免許を受けることができない。", "禁錮刑以上でなければ欠格事由にならないため、免許を受けられる。", "その役員を退職させれば、すぐにでも免許を受けられる。"], answer: 1, exp: "<b>【ひっかけ：罰金刑で一発アウトになる罪】</b><br>罰金刑で欠格事由（5年間免許不可）になるのは、<b>①宅建業法違反、②暴力的な犯罪（傷害罪、暴行罪、脅迫罪、背任罪など）</b>です。これら以外の罪（例：交通事故による過失傷害の罰金）であれば、罰金刑でもすぐに免許を受けられます。区別が重要です。" },
            { q: "【免許の基準】宅建業者Aが、宅建業法違反により免許取消処分の「聴聞の公示」がされた後、処分を免れるために合理的な理由なく自主廃業の届出をした。この場合、Aの元役員はいつまで免許を受けられないか。", options: ["自主廃業した日から5年間", "聴聞の公示日から5年間", "廃業届が受理された日から3年間", "役員個人は関係ないため、すぐに他社で免許を受けられる。"], answer: 1, exp: "<b>【ひっかけ：駆け込み廃業のペナルティ】</b><br>取消処分から逃れるために自主廃業（駆け込み廃業）した場合、ペナルティの基準日は「廃業日」ではなく、悪事がバレて手続きが始まった<b>「聴聞の公示日」から5年間</b>となります。役員も連座して5年間アウトになります。" },
            { q: "【営業保証金】新たに免許を受けた宅建業者は、営業保証金を供託した「後」に、事業を開始することができるタイミングはいつか。", options: ["供託所に現金を預けた瞬間に、すぐに開始できる。", "供託した旨を、免許権者（知事または大臣）に「届け出た後」でなければ事業を開始できない。", "供託から2週間が経過した後に開始できる。", "免許証が手元に届いた日から開始できる。"], answer: 1, exp: "<b>【ひっかけ：手続きの順番】</b><br>「免許取得」→「営業保証金の供託」→<b>「免許権者への【届出】」</b>→「業務開始」の順番です。供託するだけでなく、国や知事に「供託しました！」と届け出をして初めて、正式に営業をスタートできます。届出前に営業すると厳罰です。" },
            { q: "【営業保証金】宅建業者Aが「本店（主たる事務所）」のほかに、「2つの支店（従たる事務所）」を持つ場合、供託すべき営業保証金の合計額はいくらか。", options: ["1,000万円", "1,300万円", "2,000万円", "3,000万円"], answer: 2, exp: "<b>【ひっかけ：支店ごとの供託金】</b><br>営業保証金は、本店が<b>1,000万円</b>、支店が1店舗につき<b>500万円</b>です。よって、1,000万 ＋ (500万 × 2) ＝ 2,000万円となります。ちなみに保証協会（弁済業務保証金分担金）なら「本店60万、支店30万×2＝120万」で済みます。" },
            { q: "【営業保証金・還付】営業保証金を供託している宅建業者と「宅建業の取引」をした一般顧客Bは、その業者が供託している額の範囲内であれば、どの事務所での取引であっても還付（弁済）を受けられるか。", options: ["本店の取引でのみ還付を受けられ、支店の取引は対象外である。", "取引を行った支店が供託している額（500万円）までしか還付を受けられない。", "業者が供託している営業保証金の「総額（全額）」の範囲内で還付を受けられる。", "保証協会の承認がなければ還付を受けられない。"], answer: 2, exp: "<b>【ひっかけ：還付の上限額】</b><br>還付を受けようとする顧客は、たとえ地方の小さな支店との取引で被害に遭ったとしても、その業者が供託している<b>営業保証金の「総額（全額）」</b>の範囲内までお金を取り戻す権利があります。支店ごとの枠に縛られません。" },
            { q: "【保証協会】保証協会の社員（宅建業者）が、新たに「支店（従たる事務所）」を設置した。設置した日から何日以内に、いくらの「弁済業務保証金分担金」を保証協会に納付しなければならないか。", options: ["2週間以内に、500万円", "2週間以内に、300万円", "2週間以内に、30万円", "30日以内に、30万円"], answer: 2, exp: "<b>【ひっかけ：分担金の金額と期限】</b><br>新しく支店を増やす場合、設置した日から<b>「2週間以内」</b>に、1店舗あたり<b>「30万円」</b>の分担金を【保証協会】へ納めなければなりません。期限を過ぎると、社員の身分を失い（自動退会）、営業保証金（500万円）を自分で供託し直す羽目になります。" },
            { q: "【保証協会・還付】保証協会の社員である宅建業者と取引をした者は、その業者が社員でないとしたならば供託すべきであった「営業保証金に相当する額」まで弁済を受けられるか。", options: ["業者が保証協会に納めていた「分担金の額」までしか弁済を受けられない。", "業者が社員でなかった場合に供託すべきだった「営業保証金相当額（例：本店なら1000万円）」まで弁済を受けられる。", "保証協会が任意に決めた額までしか支払われない。", "全額例外なく国が補償する。"], answer: 1, exp: "<b>【ひっかけ：保証協会の還付上限】</b><br>保証協会の最大のメリットです。業者が保証協会に払った分担金は本店60万・支店30万ですが、顧客が被害を受けた時は、普通の営業保証金と同じ<b>「本店1,000万円・支店500万円」の枠で弁済してくれます</b>。だからこそ一般顧客も安心して取引ができます。" },
            { q: "【宅地建物取引士】宅建士資格試験に合格した者が、宅建士証の交付を受けるための前段階である「登録」を行うには、実務経験が何年以上必要か。または何が必要か。", options: ["実務経験は1年以上あれば良い。", "実務経験が「2年以上」必要であり、満たない場合は「登録実務講習」を修了しなければならない。", "実務経験に関わらず、合格すれば誰でもすぐに登録できる。", "実務経験が5年以上なければ、講習を受けても登録できない。"], answer: 1, exp: "<b>【ひっかけ：登録の要件】</b><br>試験合格後、都道府県に「登録」するには<b>「2年以上」の実務経験</b>が必要です。もし実務経験がない・足りない場合は、国土交通大臣の登録を受けた機関が行う「登録実務講習」を修了することで、2年の経験があるものとみなされて登録可能になります。" },
            { q: "【専任の宅建士】一つの事務所において、宅建業の業務に従事する者の数に対して、最低何名以上の「専任の宅建士」を置かなければならないか。", options: ["業務従事者10人に1人以上の割合", "業務従事者5人に1人以上の割合", "事務所の面積10坪につき1人以上の割合", "従業員の人数に関わらず、一律で事務所ごとに1人置けば良い。"], answer: 1, exp: "<b>【ひっかけ：専任の宅建士の設置割合】</b><br>事務所には、宅建業の業務に従事する者（パートや役員等も含む）の<b>「5人に1人以上」</b>の割合で専任の宅建士を置く必要があります。端数は切り上げるため、従業員が6人なら2人の専任宅建士が必要です。実務管理の超基本です。" },
            { q: "【専任の宅建士・欠員】専任の宅建士が退職して法定数を欠くこととなった場合、業者は何日以内に補充等の必要な措置を講じなければならないか。", options: ["すぐに（翌日まで）", "1週間以内", "2週間以内", "30日以内"], answer: 2, exp: "<b>【ひっかけ：欠員補充の猶予期間】</b><br>退職などで専任の宅建士が足りなくなった場合、<b>「2週間（14日）以内」</b>に補充などの措置をとらなければなりません（30日や1ヶ月ではありません）。なお、補充した後は「30日以内」に免許権者への変更届出が必要です。数字の混同に注意！" },
            { q: "【案内所等の届出】宅建業者Aが、分譲マンションを現地で販売するため、専任の宅建士を置く案内所（ブース）を設置した。業務を開始する日の何日前までに、誰に届け出なければならないか。", options: ["業務開始の「前日」までに、案内所の知事に届け出る。", "業務開始の「10日前」までに、免許権者および案内所の所在地を管轄する知事の双方に届け出る。", "業務開始の「7日前」までに、自らの免許権者にのみ届け出る。", "案内所であれば、届出は一切不要である。"], answer: 1, exp: "<b>【ひっかけ：案内所の届出期限と宛先】</b><br>契約や申込みを行う案内所を設置する場合、<b>「業務開始の10日前まで」</b>に届け出る必要があります（数字ひっかけ多発）。また、届出先は<b>「自らの免許権者」と「案内所の場所を管轄する知事」の【両方】</b>です。片方だけではありません。" },
            { q: "【媒介契約】宅建業者Aが依頼主（一般人）と「専任媒介契約」を締結した。この媒介契約の有効期間は、特約でどれだけ長く定めても、最長で何ヶ月となるか。", options: ["1ヶ月", "3ヶ月", "6ヶ月", "制限はない。"], answer: 1, exp: "<b>【ひっかけ：専任媒介の有効期間】</b><br>専任媒介契約（および専属専任媒介契約）の有効期間は<b>「最長で3ヶ月」</b>です。これより長い期間（例：6ヶ月）を特約で定めたとしても、法律の強行規定によって自動的に<b>3ヶ月に短縮</b>されます。なお、一般媒介契約にはこの制限はありません。" },
            { q: "【媒介契約・レインズ】「専属専任媒介契約」を締結したとき、契約締結の日から何日以内に、指定流通機関（レインズ）に物件情報を登録しなければならないか（休業日を除く）。", options: ["3日以内", "5日以内", "7日以内", "登録の義務はない。"], answer: 1, exp: "<b>【ひっかけ：レインズ登録の営業日数】</b><br>指定流通機関への登録期限は、<b>専属専任媒介＝「5日以内」</b>、<b>普通の専任媒介＝「7日以内」</b>です。どちらも「休業日（土日祝など）を除いた日数」でカウントします。一般媒介契約の場合は登録義務自体がありません。" },
            { q: "【媒介契約書面（34条の2）】媒介契約を締結したとき、業者は遅滞なく書面（34条の2書面）を作成して交付しなければならない。この書面への「宅建士の記名」は義務付けられているか。", options: ["重要書類であるため、必ず宅建士の記名が必要である。", "宅建士の記名は不要であり、業者の記名（社印等）があれば良い。", "専任媒介の場合のみ宅建士の記名が必要である。", "重要事項説明書（35条書面）と一体化していれば不要。"], answer: 1, exp: "<b>•【ひっかけ：宅建士の出番の区別】</b><br>宅建士の記名が絶対に不可欠なのは、<b>「35条書面（重要事項説明書）」</b>と<b>「37条書面（契約書面）」</b>の2つだけです！この「媒介契約書面（34条の2）」には、宅建士の記名は法律上**不要**（会社名義の交付でOK）です。実務の書類と混同しやすいポイントです。" },
            { q: "【重要事項説明（35条書面）】重要事項説明は、いつ、誰に対して行わなければならないか。", options: ["契約が成立した「後」遅滞なく、売主と買主の双方に対して行う。", "契約が成立する「前」に、権利を取得しようとする者（買主や借主）に対して行う。", "売買契約の締結と「同時」に、売主に対して行う。", "代金の決済（引き渡し）の時に、買主に対して行う。"], answer: 1, exp: "<b>【ひっかけ：重説のタイミングと相手】</b><br>重要事項説明は、買主が「この物件、本当に買って大丈夫か？」を判断するために行うものなので、必ず<b>【契約が成立する前】</b>に、<b>【権利を取得しようとする者（買主・借主）】</b>に対して行わなければなりません。売主や貸主（手放す側）に説明する必要はありません。" },
            { q: "【重要事項説明・宅建士証】重要事項説明を行う際、宅建士は相手方から「提示の求め」がなかった場合でも、宅建士証を提示しなければならないか。", options: ["相手から請求があった場合のみ提示すれば良い。", "請求の有無に関わらず、説明を開始する前に必ず提示しなければならない。", "提示しなくても、机の上に置いておけば良い。", "あらかじめコピーを渡してあれば、現物の提示は不要。"], answer: 1, exp: "<b>【ひっかけ：宅建士証提示の義務】</b><br>重要事項説明をするときは、相手から言われなくても<b>「必ず宅建士証を提示」</b>しなければなりません。これに違反すると10万円以下の過料に処せられることがあります。なお、実務の「取引関係者から請求があったとき」は、重説中以外でも提示義務があります。" },
            { q: "【重要事項説明・貸借の特例】宅地建物の「貸借（賃貸借）」の媒介を行う場合、35条書面において「代金または交換差金以外に授受される金銭（敷金、礼金、保証金など）の額および授受の目的」は説明が必要か。", options: ["売買ではないため、説明する必要はない。", "金額に関わらず、必ずその額および授受の目的を説明しなければならない。", "10万円を超える場合のみ説明が必要である。", "契約書（37条書面）に書くため、35条での説明は不要。"], answer: 1, exp: "<b>【ひっかけ：貸借での重要説明項目】</b><br>アパートの賃貸などでは、敷金や礼金、更新料といった「家賃以外のお金」をめぐるトラブルが非常に多いため、これらは<b>「額」も「目的」も100%説明が必要</b>です。売買の項目との引っ掛けでよく狙われます。" },
            { q: "【重要事項説明・業者間取引】宅建業者相互間の売買取引（プロ同士の取引）において、35条書面（重要事項説明）のルールはどうなるか。", options: ["プロ同士なので、書面の交付も説明もすべて省略できる。", "書面の交付は必要であるが、宅建士による「説明」は不要である。", "一般の取引と全く同じく、書面を交付して説明も行わなければならない。", "説明は必要だが、書面の交付は不要。"], answer: 1, exp: "<b>【ひっかけ：業者間取引の免除】</b><br>これも大好物のひっかけです。買主が「宅建業者（プロ）」である場合、知識があるため宅建士による<b>「説明」は不要（免除）</b>になります。しかし、<b>「35条書面（書類）の交付」自体は省略できません</b>。交付まで不要とするひっかけに要注意です。" },
            { q: "【契約書面（37条書面）】37条書面（契約書面）は、いつ、誰に対して交付しなければならないか。", options: ["契約が成立する前に、買主に対してのみ交付する。", "契約が成立した後、遅滞なく、契約の「双方の当事者（売主と買主の双方）」に交付しなければならない。", "代金支払いと同時に、買主にのみ交付する。", "媒介契約を結んだ時に、依頼者に交付する。"], answer: 1, exp: "<b>【ひっかけ：37条のタイミングと相手】</b><br>37条書面（契約書・言った言わないの証拠）は、<b>【契約が成立した後、遅滞なく】</b>、売主と買主の<b>【双方】</b>に交付しなければなりません。35条（契約前・買主のみ）との違いを完璧に整理しておきましょう。" },
            { q: "【37条書面の記載事項】「代金・対価の支払時期および支払方法」は、35条書面（重説）と37条書面（契約書）のそれぞれでどのような扱いになるか。", options: ["35条でも説明が必要であり、37条にも必ず記載する。", "35条では説明不要（記載不要）だが、37条には「必ず記載（必要的記載事項）」しなければならない。", "35条では説明が必要だが、37条では特約がある場合のみ記載する。", "どちらの書面でも、特約がない限り記載は不要である。"], answer: 1, exp: "<b>【ひっかけ：35条と37条のすり替え】</b><br>試験で一番点数が落ちる超絶ひっかけポイントです。「代金の支払い時期や方法」は、契約の核心なので<b>「37条（契約書）には【必ず記載】」</b>します。しかし、契約前の「35条（重説）」の段階では、まだ支払い方法は決まっていないこともあるため<b>説明義務はありません</b>。これを知っているだけで1点拾えます。" },
            { q: "【37条書面・宅建士の記名】37条書面において、宅建士の「記名」は必要か。また、買主が宅建業者（プロ同士）の場合、記名を省略できるか。", options: ["宅建士の記名は必要だが、業者間取引（プロ同士）なら省略できる。", "業者間取引であっても、37条書面への宅建士の記名は省略できない（必ず必要）。", "37条書面には業者の代表印があれば良く、宅建士の記名はそもそも不要。", "記名ではなく、電子署名であれば宅建士でなくても良い。"], answer: 1, exp: "<b>【ひっかけ：37条はプロ同士でもガチガチ】</b><br>35条書面（重説）の「説明」は業者間なら省略できましたが、<b>37条書面（契約書）のルールは、相手がプロ（業者）であっても、一切手抜きができません</b>。書面の交付も、宅建士の「記名」も、すべて省略不可です。" },
            { q: "【自ら売主制限・クーリング・オフ】宅建業者が自ら売主となり、一般人Bが買主となる売買契約において、Bが「ホテルのロビー」で買受けの申込みをし、その場で契約を締結した。Bはクーリング・オフによる解除ができるか。", options: ["ホテルのロビーは公開された場所であるため、解除できない。", "Bの自宅や事務所等でない限り、ホテルのロビーや喫茶店での申込み・契約はクーリング・オフによる解除ができる。", "すでに契約を締結してしまっているため、場所に関わらず解除できない。", "売主である業者の承諾がなければ解除できない。"], answer: 1, exp: "<b>【ひっかけ：クーリング・オフができる場所】</b><br>クーリング・オフができるかどうかは「どこで申込み（または契約）をしたか」で決まります。業者の事務所や、顧客が「自分の家（または会社）に来て」と指定した場所以外（ホテルのロビー、喫茶店、レストランなど）での取引は、頭が冷やせない場所とみなされ、<b>クーリング・オフが可能</b>になります。" },
            { q: "【自ら売主制限・クーリング・オフの期限】クーリング・オフによる契約解除の通知は、クーリング・オフができる旨を書面で告げられた日から数えて「何日以内」に行わなければならないか。また、その効力はいつ発生するか。", options: ["7日以内。通知が業者に「届いた時」に効力が発生する。", "8日以内。通知を「発送した時（書面を出した時）」に効力が発生する。", "10日以内。通知を発送した時に効力が発生する。", "いつでも可能であり、期限はない。"], answer: 1, exp: "<b>•【ひっかけ：日数と発信主義】</b><br>クーリング・オフの期限は、書面告知日から<b>「8日以内」</b>です。また、解除の効力は通知を<b>「発送した時」</b>に発生します（発信主義）。8日目の消印で手紙を出せば、業者に届くのが9日目であっても有効に解除されます。" },
            { q: "【自ら売主制限・手付金の性質】宅建業者が自ら売主、一般人が買主となる売買契約において、買主が交付した手付金は、契約書に何も記載（特約）がない場合、どのような性質を持つか。", options: ["何も記載がなければ、単なる証約手付（証拠）となり、手付解除はできない。", "特約がなくても、法律上当然に「解約手付」とみなされ、相手方が履行に着手するまでは手付放棄（または倍返し）で解除できる。", "違約金（ペナルティ）として扱われる。", "業者側にのみ解除権が与えられる手付となる。"], answer: 1, exp: "<b>【ひっかけ：手付の性質の強制】</b><br>宅建業者が自ら売主となる場合、交付される手付金は、特約の有無に関わらず強制的に<b>「解約手付」</b>としての性質を持ちます。「手付解除はできない」という買主に不利な特約は無効になります。" },
            { q: "【自ら売主制限・手付金額の制限】宅建業者が自ら売主、一般人が買主となる売買契約において、業者が受け取ることができる「手付金の額」の上限は、代金のいくらか。", options: ["代金の10分の1（10%）", "代金の10分の2（20%）", "代金の10分の3（30%）", "法律上の上限額は定められていない。"], answer: 1, exp: "<b>【ひっかけ：自ら売主の手付制限】</b><br>業者が自ら売主となる場合、受け取れる手付金の額は<b>「代金の20%（10分の2）」が上限</b>です。これを超える額の手付金を受け取る特約をした場合、20%を超える部分の金額が無効（返さなければならない）となります。" },
            { q: "【自ら売主制限・手付金等の保全措置】宅建業者が自ら売主、一般人が買主となる「未完成」の建物の売買において、業者が契約時に手付金を受領する場合、受領する額が代金の何%以下、かつ何万円以下であれば、事前の保全措置（銀行の保証等）が【不要】か。", options: ["代金の10%以下、かつ1,000万円以下", "代金の5%以下、かつ500万円以下", "代金の20%以下、かつ1,000万円以下", "未完成物件であれば、金額に関わらず必ず保全措置が必要。"], answer: 1, exp: "<b>【ひっかけ：未完成物件の保全ライン】</b><br>未完成物件の保全措置が不要なラインは、<b>「代金の5%以下」かつ「500万円以下」</b>です（両方を満たす必要があります）。これを超える場合は、手付金を受け取る「前」に保全措置を講じなければなりません。なお、完成物件の場合は「10%以下かつ1,000万円以下」に基準が緩くなります。" },
            { q: "【自ら売主制限・担保責任の特約】宅建業者が自ら売主、一般人が買主となる売買契約において、目的物の品質に関する不適合（欠陥）の責任を負う期間について、次のうち「有効」となる特約はどれか。", options: ["「買主が不適合を知った時から6ヶ月間」とする特約", "「物件の引渡しの日から2年間」とする特約", "「売主は一切の契約不適合責任を負わない」とする特約", "「物件の引渡しの日から1年間」とする特約"], answer: 1, exp: "<b>【ひっかけ：例外的に許される特約】</b><br>自ら売主制限において、契約不適合責任（民法の原則は知った時から1年）を買主に不利に変更することは原則禁止ですが、唯一の例外として<b>「【引渡しの日から2年間】以上とする特約」だけは有効</b>と認められています。これより短いもの（引渡しから1年など）はすべて無効になり、民法の原則に戻ります。" },
            { q: "【報酬の制限】宅建業者Aが、依頼者から媒介（片手）を頼まれ、代金4,000万円の売買物件を成約させた。法律上、Aが受け取ることができる報酬の上限額（消費税別）の計算式として正しいものはどれか。", options: ["4,000万円 × 3%", "4,000万円 × 3% ＋ 6万円", "4,000万円 × 4% ＋ 2万円", "4,000万円 × 5%"], answer: 1, exp: "<b>【ひっかけ：報酬計算の速算式】</b><br>売買の報酬計算（400万円超の物件）の速算式は<b>「代金×3%＋6万円」</b>です（消費税は別途かかります）。実務でも必須の知識ですね。試験ではこの計算をベースに、「売主・買主の双方から媒介を頼まれた場合（両手）」は、それぞれの側からこの上限額をもらえる（計2倍）という知識も問われます。" }
        ]
    },
    legal: {
        title: "宅建 法令上の制限 弱点克服ドリル",
        primary: "#0f766e",
        bg: "#f0fdfa",
        questions: [
            { q: "【都市計画法】市街化区域と市街化調整区域に関する記述のうち、正しいものはどれか。", options: ["市街化区域は、すでに市街地を形成している区域であり、市街化調整区域は、計画的に市街化を図る区域である。", "市街化区域は、すでに市街地を形成している区域およびおおむね10年以内に優先的かつ計画的に市街化を図る区域である。", "市街化調整区域は、市街化を「促進」する区域である。", "都市計画区域であれば、必ず市街化区域と市街化調整区域に区分（線引き）しなければならない。"], answer: 1, exp: "<b>【ひっかけ：区域の定義と線引き】</b><br>市街化区域の定義として「おおむね10年以内」は超頻出キーワードです。調整区域は市街化を「抑制（おさえる）」する区域です。また、線引きは「しなければならない（義務）」ではなく、指定しない区域（非線引き区域）もあるため「することができる」が正解です。" },
            { q: "【都市計画法】開発行為の定義において、次のうち開発許可の対象となる「開発行為」に該当するものはどれか。", options: ["建築物の建築または特定工作物の建設の用に供する目的で行う、土地の区画形質の変更", "単に青空駐車場を作る目的で行う、土地の砂利敷き行為", "自己の居住用マンションを建築する目的で行う、土地の売買契約の締結", "既存の建物の外壁を塗り替える行為"], answer: 0, exp: "<b>【ひっかけ：開発行為の定義】</b><br>開発行為とは、<b>「建築物」または「特定工作物」</b>を建てる目的で行う<b>「土地の区画形質の変更（造成工事など）」</b>を指します。青空駐車場（建築物ではない）や、単なる土地の売買は開発行為にあたりません。" },
            { q: "【都市計画法】市街化区域内において、開発許可が「原則として不要」となる開発行為の規模（面積）はどれか（三大都市圏の特例は考慮しない）。", options: ["1,000㎡未満の開発行為", "3,000㎡未満の開発行為", "10,000㎡未満の開発行為", "市街化区域内では面積に関わらずすべて許可が必要である。"], answer: 0, exp: "<b>【ひっかけ：区域ごとの面積要件】</b><br>開発許可の面積免除基準は、<b>市街化区域＝1,000㎡未満</b>、準都市計画区域・非線引き区域＝3,000㎡未満、都市計画区域外＝10,000㎡未満が不要です。なお、<b>市街化調整区域は「面積に関わらず」原則として一律で許可が必要</b>です。数字が入れ替えて出題されます。" },
            { q: "【都市計画法】市街化区域内において、農業を営む者が「農林漁業用の建築物（温室やサイロ等）」を建築する目的で1,500㎡の土地を造成する場合、開発許可は必要か。", options: ["農林漁業用の建築物であるため、区域を問わず常に許可は不要である。", "市街化区域内であるため、農林漁業用であっても1,000㎡以上であれば開発許可が必要である。", "農業委員会の届出があれば、開発許可は不要である。", "知事の特例許可が必要である。"], answer: 1, exp: "<b>【ひっかけ：農林漁業用の大罠】</b><br>「農林漁業用の建築物」に対する開発許可の免除特例は、市街化調整区域、非線引き区域、準都市計画区域でのみ適用されます。<b>市街化区域内では、農林漁業用であっても、1,000㎡以上であれば容赦なく開発許可が必要</b>になります！非常に引っかかりやすいポイントです。" },
            { q: "【都市計画法】開発行為を行う場合、その「建築物の種類」によって、区域を問わず常に開発許可が不要となるものはどれか。", options: ["学校・病院・公設市場", "駅舎・図書館・公民館", "都道府県や市町村の庁舎（役所）", "神社・寺院・教会"], answer: 1, exp: "<b>【ひっかけ：公益目的建築物の区別】</b><br>「駅舎、図書館、公民館、変電所」などの公益上必要な建築物は、どこで開発を行っても許可が不要です。しかし、<b>学校、病院、役所、火葬場などは免除されず、原則通り開発許可が必要</b>になります。実務の感覚とズレやすいため試験で大好物のひっかけです。" },
            { q: "【都市計画法】都市計画施設（計画段階の道路や公園など）の区域内において建築物の建築を行おうとする者は、原則として誰の許可を受けなければならないか。", options: ["国土交通大臣", "都道府県知事（市長）", "都市計画に関わる組合長", "指定確認検査機関"], answer: 1, exp: "<b>【ひっかけ：建築確認との主体の違い】</b><br>都市計画施設内の建築制限を解除する許可権者は<b>「都道府県知事（指定都市等の区域内では市長）」</b>です。建築基準法の「建築主事」や「指定確認検査機関」ではないので、言葉のすり替えに注意してください。" },
            { q: "【建築基準法】2025年4月施行の法改正（新2号建築物・4号特例の縮小）に準拠。都市計画区域内において、「木造2階建て・延べ面積150㎡」の一戸建て住宅を新築する場合、建築確認は必要か。", options: ["平屋ではない（2階建て）ため、確認審査が必要であり、構造計算書等の審査省略（旧4号特例）も適用されない（新2号建築物）。", "木造住宅であれば、3階建て以上でない限り建築確認は不要である。", "都市計画区域外であれば確認が必要だが、区域内なら不要である。", "建築士が設計していれば、建築確認の手続き自体が免除される。"], answer: 0, exp: "<b>【ひっかけ：最新大改正ポイント】</b><br>従来の「4号特例（木造2階建て等の審査省略）」は廃止されました。最新法では、木造・非木造問わず<b>「2階建て以上」または「延べ面積200㎡超」</b>の建築物は<b>『新2号建築物』</b>となり、都市計画区域等内では確認審査（構造審査含む）が厳格に行われます。古い参考書での勉強は厳禁の超重要エリアです。" },
            { q: "【建築基準法】次の建築物のうち、都市計画区域の「外（全国どこでも）」であっても、新築時に必ず建築確認を受けなければならないものはどれか。", options: ["延べ面積150㎡の平屋の木造一戸建て住宅", "延べ面積250㎡の平屋の店舗（特殊建築物）", "延べ面積100㎡の2階建ての事務所", "都市計画区域外であれば、どんな建築物でも確認は一切不要である。"], answer: 1, exp: "<b>【ひっかけ：特殊建築物の全国一律要件】</b><br>劇場、店舗、マンションなどの「特殊建築物」で、その床面積が<b>「200㎡を超える」</b>もの（新1号建築物）は、都市計画区域の内外を問わず、<b>日本全国どこに建てようが必ず建築確認が必要</b>となります。住宅や事務所は区域外なら規模によって不要な場合があります。" },
            { q: "【建築基準法】道路に関する規定について、建築基準法上の「道路」とは、原則として幅員が何メートル以上のものをいうか。また、道路内に建築物を建築することはできるか。", options: ["幅員4m以上。道路内には原則として建築物を建築することができない。", "幅員2m以上。道路内であっても知事の許可があれば自由に建築できる。", "幅員4m以上。地階（地下室）であれば道路の下に突き出しても建築できる。", "幅員6m以上。道路内への建築は一切例外なく禁止されている。"], answer: 0, exp: "<b>【ひっかけ：道路内建築制限の原則】</b><br>建築基準法上の道路は原則<b>「幅員4m以上」</b>です。また、交通や安全の観点から道路内への建築は原則「禁止」です。ただし、突出しが地階であっても原則禁止ですが、「公衆便所」や「安全上支障がない敷地内の渡り廊下」などで特定行政庁が認めた場合は例外的に建築できます。" },
            { q: "【建築基準法】「接道義務」に関する次の記述のうち、正しいものはどれか。", options: ["建築物の敷地は、道路に1.5メートル以上接しなければならない。", "建築物の敷地は、道路に2メートル以上接しなければならない。", "敷地の周囲に広い空地があっても、必ず道路に接していなければ一切建築できない。", "接する道路は、自動車専用道路であっても構わない。"], answer: 1, exp: "<b>【ひっかけ：接道長さと例外】</b><br>建築物の敷地は、道路に<b>「2メートル以上」</b>接しなければなりません（数字ひっかけ注意）。なお、敷地の周囲に広い空地（公園や広場）があり、特定行政庁が安全上支障がないと認めて「建築審査会の同意」を得て許可した場合は、接道していなくても建築できる例外があります。" },
            { q: "【建築基準法】幅員4メートル未満の道路で、建築基準法第42条第2項の規定により「道路とみなされたもの（2項道路）」の境界線（セットバック線）は、原則としてどこになるか。", options: ["現在の道路の縁（へり）の線", "道路の中心線から水平距離で2メートル後退した線", "道路の中心線から水平距離で4メートル後退した線", "道路の反対側の縁から1メートル後退した線"], answer: 1, exp: "<b>【ひっかけ：セットバックの基準】</b><br>2項道路（昔からある狭い道）は、将来4m幅を確保するため、原則として<b>「道路の中心線から両側に2mずつ後退した線」</b>を道路境界線とみなします。後退した部分（セットバック部分）には建物はもちろん、門や塀も建てられず、敷地面積にも算入できません。" },
            { q: "【建築基準法】容積率の制限について、前面道路の幅員が「12メートル未満」の場合、都市計画で定められた容積率と、前面道路の幅員に一定の数値を乗じたものの、どちらが適用されるか。", options: ["常に都市計画で定められた容積率が適用される。", "前面道路の幅員に数値を乗じた容積率が適用される。", "両者を比較して「小さい方（厳しい方）」の数値が上限となる。", "両者を比較して「大きい方（緩い方）」の数値が上限となる。"], answer: 2, exp: "<b>【ひっかけ：容積率のダブルチェック】</b><br>前面道路が12m未満と狭い場合、容積率は「都市計画の指定値」と「道路幅員×法定係数（住居系は0.4、その他は0.6など）」を計算し、<b>『小さい方（厳しい方）』が上限</b>となります。計算問題としても出題されるため、厳しい方が選ばれる点を徹底記憶してください。" },
            { q: "【建築基準法】建ぺい率の緩和規定について、次のうち「建ぺい率の制限が解除（10分の10＝100%に緩和）」となる組み合わせはどれか。", options: ["「商業地域」内にある「耐火建築物」", "「防火地域」内にある「耐火建築物」で、かつ都市計画での建ぺい率指定が「10分の8（80%）」の地域にあるもの", "「準防火地域」内にある「準耐火建築物」で、角地に指定されているもの", "建ぺい率が100%になる特例は存在しない。"], answer: 1, exp: "<b>【ひっかけ：建ぺい率100%の条件】</b><br>建ぺい率が完全に撤廃（100%）となるのは、<b>「指定建ぺい率が80%の地域」＋「防火地域」＋「耐火建築物等」</b>の条件が重なったときです。商業地域は指定建ぺい率が最初から80%のことが多いですが、地域名ではなく「指定80%＋防火＋耐火」という条件の組み合わせで覚えるのがひっかけ対策です。" },
            { q: "【建築基準法】「北側斜線制限」が適用される用途地域は、次のうちどれか。", options: ["第一種低層住居専用地域、第二種低層住居専用地域、田園住居地域、第一種中高層住居専用地域、第二種中高層住居専用地域", "商業地域、近隣商業地域などの商業系地域すべて", "工業専用地域を除くすべての用途地域", "日本全国すべての用途地域一律で適用される。"], answer: 0, exp: "<b>【ひっかけ：斜線制限の適用地域】</b><br>北側斜線制限は、北側にある家の日当たりを守るためのルールなので、<b>「低層・中高層住居専用地域」および「田園住居地域」にのみ適用</b>されます。住居系でも「住居地域（第一種・第二種）」や「準住居地域」には適用されません（そこは高度地区でカバーします）。" },
            { q: "【建築基準法】「日影規制（ひかげきせい）」が、原則として『一切適用されない（対象外）』となる用途地域の組み合わせはどれか。", options: ["第一種低層住居専用地域・第二種低層住居専用地域", "第一種中高層住居専用地域・第二種中高層住居専用地域", "商業地域・工業地域・工業専用地域", "近隣商業地域・準工業地域"], answer: 2, exp: "<b>【ひっかけ：日影規制の対象外地域】</b><br>日影規制は、日当たり重視の住居系地域を中心にかかります。オフィスや工場がメインである<b>「商業地域」「工業地域」「工業専用地域」の3つには、原則として日影規制は適用されません</b>。ただし、これらの地域にある建物でも、高さが一定を超えて隣の住居系地域に日影を落とす場合は規制がかかるという例外もあります。" },
            { q: "【国土利用計画法】事後届出が必要となる土地売買等の契約において、市街化区域内における面積基準（免除されるライン）として正しいものはどれか。", options: ["1,000㎡以上の場合に届出が必要（1,000㎡未満は免除）", "2,000㎡以上の場合に届出が必要（2,000㎡未満は免除）", "5,000㎡以上の場合に届出が必要（5,000㎡未満は免除）", "10,000㎡以上の場合に届出が必要（10,000㎡未満は免除）"], answer: 1, exp: "<b>【ひっかけ：国土法の面積「2・5・10」】</b><br>国土利用計画法の事後届出面積は、<b>市街化区域＝2,000㎡以上</b>、それ以外の都市計画区域（非線引き等）＝5,000㎡以上、都市計画区域外＝10,000㎡以上で届出が必要です。都市計画法の開発許可（1,000・3,000・10,000）の数字とごちゃ混ぜにするひっかけが超定番です。" },
            { q: "【国土利用計画法】事後届出に関する次の記述のうち、正しいものはどれか。", options: ["土地の売買契約を締結した日から「2週間以内」に、売主と買主が連名で届け出なければならない。", "土地の売買契約を締結した日から「2週間以内」に、「権利取得者（買主）」が届け出なければならない。", "土地の売買契約を締結する「前」にあらかじめ届け出なければならない。", "事後届出を怠った場合でも、締結した売買契約自体は無効にはならないが、刑事罰（懲役や罰金）の対象となる。"], answer: 1, exp: "<b>【ひっかけ：誰が・いつ・どうする？】</b><br>事後届出を行うのは<b>「権利取得者（買主などお金を払って土地を得る側）」だけ</b>です。期間は「契約締結日から2週間以内」です。なお、届出をサボると刑事罰を受けますが、契約自体の法律上の効力は「有効」のままです（無効にはならない）。" },
            { q: "【国土利用計画法】次の取引のうち、国土利用計画法の「事後届出」が必要となるものはどれか。", options: ["Aが所有する時価1,000万円の土地（市街化区域内3,000㎡）を、Bに「贈与」した場合", "Cが死亡し、Dがその遺産として土地（都市計画区域外20,000㎡）を「相続」した場合", "Eが所有する土地（市街化区域内3,000㎡）に、Fが債権担保のために「抵当権を設定」した場合", "Gが所有する土地（市街化区域内3,000㎡）を、Hに「売買（権利金の授受を伴う地上権の設定含む）」した場合"], answer: 3, exp: "<b>【ひっかけ：届出対象となる取引の性質】</b><br>国土法の届出が必要なのは<b>「対価の授受を伴う土地の権利移転・設定契約」</b>です。売買や交換、権利金を伴う賃貸借が対象です。タダでもらう「贈与」や「相続」、対価を払って土地そのものを手に入れたわけではない「抵当権設定」は届出不要です。" },
            { q: "【国土利用計画法】Aが市街化区域内において、Bから1,500㎡の土地を買い、その翌日に隣接するCから1,000㎡の土地を買う契約を結んだ（合計2,500㎡）。この場合、Aは事後届出を行う必要があるか。", options: ["個々の契約はいずれも2,000㎡未満であるため、届出は一切不要である。", "買い集めた結果、一体として利用する「一団の土地」となり2,000㎡以上となるため、両方の契約について届出が必要である。", "最初のBとの契約のみ届出が必要である。", "事前の許可が必要である。"], answer: 1, exp: "<b>【ひっかけ：一団の土地（買い集め）】</b><br>「一団の土地」の規定です。買い主（A）を基準にして、最終的にまとめて使う目的で買い集める土地の合計面積が基準（市街化区域なら2,000㎡）以上になる場合、個々の契約が基準未満であっても、<b>すべての契約について届出が必要</b>になります。" },
            { q: "【農地法】農地法第3条、4条、5条の規定において、その「許可権者（または届出先）」の組み合わせとして、誤っているものはどれか。", options: ["3条許可：農業委員会", "4条許可（市街化区域外）：都道府県知事等", "5条許可（市街化区域内）：農業委員会への事前の届出", "4条許可（市街化区域内）：都道府県知事への事前の届出"], answer: 3, exp: "<b>【ひっかけ：市街化区域内の特例】</b><br>農地法最大のひっかけポイントです。<b>市街化区域内</b>にある農地を転用する場合（4条・5条）、都道府県知事の重い許可は不要となり、<b>「農業委員会への事前の届出」</b>だけで済みます。選択肢4は「都道府県知事への届出」となっているため誤りです。" },
            { q: "【農地法】農地法第3条に関する次の記述のうち、正しいものはどれか。", options: ["農地を農地のまま売買する場合、農業委員会の許可が必要である。", "自分が所有する農地を、宅地に転用して自ら居住する場合、3条許可が必要である。", "相続によって農地の所有権を取得した場合、3条許可を受けなければならない。", "3条許可を受けずに締結した農地の売買契約も、物権変動としては有効に成立する。"], answer: 0, exp: "<b>【ひっかけ：3条の性質と相続】</b><br>3条は「農地を農地のまま（権利移転）」するケースです。自分の農地を宅地にするのは4条です。また、<b>「相続」による取得は3条許可は不要</b>です（農業委員会への事後の届出は必要）。なお、3条許可のない売買契約は法律上「無効」となります。" },
            { q: "【農地法】農地法上の「農地」に該当するかどうかの判断基準として、正しいものはどれか。", options: ["登記簿上の地目が「農地」や「田・畑」となっていれば、現在は荒れ地であってもすべて農地として扱われる。", "登記簿上の地目に関わらず、現在の「客観的な事実（実際の状態）」によって判断される。", "固定資産税の課税台帳の記載によってのみ判断される。", "土地の所有者が「農地である」と主張しているか否かで判断される。"], answer: 1, exp: "<b>【ひっかけ：現況主義】</b><br>農地法は<b>「現況主義」</b>をとっています。登記簿の地目が何であれ、現在実際に耕作されている土地であれば「農地」ですし、逆に登記が農地でも、長年適法に工場になっていれば農地法上の農地とは扱われません。実務でも超重要知識です。" },
            { q: "【盛土規制法（宅地造成及び特定盛土等規制法）】宅地造成等工事規制区域内において、以下の工事を行う場合、原則として知事の「許可」が必要となるものはどれか。", options: ["切土であって、その軽微な工事として高さ1.5mの崖を生じるもの", "盛土であって、その工事によって高さ1.5mの崖を生じるもの", "切土と盛土を同時に行うが、崖の高さが1m未満のもの", "面積が100㎡の土地で行う盛土工事"], answer: 1, exp: "<b>【ひっかけ：最新の盛土規制法の規模要件】</b><br>大改正された盛土規制法の許可基準は、①<b>切土</b>で高さ<b>2m超</b>の崖、②<b>盛土</b>で高さ<b>1m超</b>の崖、③切土・盛土同時で高さ2m超の崖、④高さに関わらず<b>面積500㎡超</b>のいずれかに該当する場合に許可が必要です。盛土の「1m超」に該当するため、選択肢2が正解です。" },
            { q: "【盛土規制法】宅地造成等工事規制区域の指定の際、すでにその区域内で宅地造成等工事を行っている者は、指定があった日から何日以内に知事に届け出なければならないか。", options: ["14日以内", "21日以内", "30日以内", "届け出る必要はない（工事をそのまま続行できる）。"], answer: 1, exp: "<b>【ひっかけ：指定工事の既着手届】</b><br>後から区域に指定されてしまった場合、工事を止める必要はありませんが、指定の日から<b>「21日以内」</b>に知事へ「届け出」を行う必要があります（2週間や30日ではない数字ひっかけです）。" },
            { q: "【土地区画整理法】土地区画整理組合を設立して土地区画整理事業を施行しようとする場合、どのような要件が必要か。", options: ["3人以上の者が共同して、知事の許可を受けなければならない。", "7人以上の者が共同して定款等を定め、施行地区内の宅地の所有者等の「3分の2以上」の同意を得て、知事の認可を受けなければならない。", "所有者全員の同意があれば、知事の認可なく自由に設立できる。", "宅地建物取引業者の資格を持つ者が1人以上含まれていなければならない。"], answer: 1, exp: "<b>【ひっかけ：組合設立の数字「7人・3分の2」】</b><br>民間施行の組合設立要件です。<b>「7人以上」</b>で共同し、エリア内の所有者および借地権者のそれぞれの<b>「3分の2以上」</b>の同意を得て、<b>「知事の認可」</b>（許可ではない）を受ける必要があります。数字と用語のオンパレードです。" },
            { q: "【土地区画整理法】土地区画整理事業の施行地区内において、事業の障害となるような「建築物の新築」や「土地の形質の変更」を行おうとする者は、誰の「許可」を受けなければならないか。", options: ["土地区画整理組合（施行者）", "都道府県知事等（市長）", "国土交通大臣", "建築主事"], answer: 1, exp: "<b>【ひっかけ：工事制限の許可権者】</b><br>事業を邪魔されないための建築制限ですが、この許可を与えるのは施行者（組合や市町村）ではなく、<b>「都道府県知事等（市長）」</b>です。「組合が施行するから組合の許可でいいだろう」という受験生の思い込みを狙った大人気ひっかけ問題です。" },
            { q: "【土地区画整理法】「換地処分（かんちしょぶん）」の効力について、工事が終わって新しく割り当てられた土地（換地）は、いつから従前の土地（古い土地）とみなされるか。", options: ["換地処分の通知が届いた日", "換地処分の公告があった日の「翌日」", "換地処分の公告があった日の「当日（即日）」", "換地処分の登記が完了した日"], answer: 1, exp: "<b>【ひっかけ：効力発生は『翌日』】</b><br>土地区画整理法で一番狙われるセリフです。換地処分の効力（古い土地から新しい土地へ完全に権利がスライドするタイミング）は、<b>「換地処分の公告があった日の【翌日】」</b>です。当日や即日とするひっかけが毎年出ます。" },
            { q: "【諸法令・道路法】道路法に関する次の記述のうち、正しいものはどれか。", options: ["道路の区域が決定された後、形が作られる前であれば、その区域内において知事の許可なく自由に建物を建築できる。", "道路管理者が道路の占有許可を与えた場合、建築基準法上の建築確認は自動的に免除される。", "道路の区域が決定された後、敷地を造成したり建築物を建築したりする場合、道路管理者の許可を受けなければならない。", "民間人が私道を勝手に公道に変更することは、道路法上自由にできる。"], answer: 2, exp: "<b>【ひっかけ：諸法令の引っかけ】</b><br>法令上の制限の最後に1問だけ出題される「その他の諸法令」からの対策。道路の区域が決まった段階で、事業の邪魔になるような造成や建築は<b>「道路管理者」の許可</b>が必要になります（知事ではない）。また、占有許可と建築確認は全くの別物です。" },
            { q: "【都市計画法】用途地域が指定されていない「白地地域（準都市計画区域等）」において、知事が指定できる、建築物の建ぺい率や容積率の制限に関する記述として、正しいものはどれか。", options: ["用途地域がない地域には、建ぺい率や容積率の制限は一切存在しない。", "用途地域が指定されていなくても、地域の実情に応じて、一定の選択肢（メニュー）の中から建ぺい率や容積率の上限を都市計画で定める。", "用途地域がない場所は、一律で建ぺい率30%、容積率50%と法律で固定されている。", "用途地域が指定されていない区域には、そもそも建物を建てること自体が禁止されている。"], answer: 1, exp: "<b>【ひっかけ：白地地域の規制】</b><br>用途地域が指定されていない区域（白地地域）であっても、完全に無法地帯になるわけではありません。都道府県知事が、国が定めた選択肢（メニュー）の中から、その土地に合わせた建ぺい率や容積率の上限を選んで当てはめます。" },
            { q: "【建築基準法】「災害危険区域」や「特定用途制限地域」など、自治体が地域の特性に合わせて「条例」によって建築物の制限を厳しくしたり緩和したりできる規定に関する記述のうち、正しいものはどれか。", options: ["地方自治体は、建築基準法の規定よりも常に緩い（甘い）ルールを条例で自由に制定できる。", "地方自治体は、条例によって、災害の危険著しい区域内における住居の建築を禁止することができる。", "条例による制限は、法律の規定よりも常に効力が劣るため、守らなくても罰則はない。", "条例を制定するためには、内閣総理大臣の直接の認可が必要である。"], answer: 1, exp: "<b>【ひっかけ：条例による建築制限】</b><br>建築基準法第39条に基づき、自治体は<b>「災害危険区域」</b>を条例で指定し、そこに「人が住む家を建ててはならない」という非常に厳しい独自の制限をかけることができます。地方独自の安全対策を優先するための仕組みです。" }
        ]
    }
};

let currentCategory = '';
let questions = [];
let currentQuestionIndex = 0;
let score = 0;

function startQuiz(category) {
    currentCategory = category;
    const data = appData[category];
    
    // テーマカラーの変更
    document.documentElement.style.setProperty('--primary', data.primary);
    document.documentElement.style.setProperty('--bg-color', data.bg);
    
    // タイトルの設定
    document.getElementById('quiz-title').innerText = data.title;
    
    // 30問の中からランダムに10問を選択
    questions = [...data.questions].sort(() => 0.5 - Math.random()).slice(0, 10);
    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    
    showQuestion();
}

function showQuestion() {
    const qData = questions[currentQuestionIndex];
    document.getElementById('progress-text').innerText = `第 ${currentQuestionIndex + 1} 問 / 10`;
    document.getElementById('question-text').innerHTML = qData.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${index + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
    });

    document.getElementById('explanation-area').classList.remove('show');
}

function checkAnswer(selectedIndex, selectedBtn) {
    const qData = questions[currentQuestionIndex];
    const options = document.querySelectorAll('.option-btn');
    
    options.forEach(btn => btn.disabled = true);
    
    const expTitle = document.getElementById('explanation-title');
    
    if (selectedIndex === qData.answer) {
        selectedBtn.classList.add('correct');
        expTitle.innerText = "⭕ 正解！";
        expTitle.className = "explanation-title correct-text";
        score++;
    } else {
        selectedBtn.classList.add('incorrect');
        options[qData.answer].classList.add('correct');
        expTitle.innerText = "❌ 不正解...";
        expTitle.className = "explanation-title incorrect-text";
    }

    document.getElementById('explanation-text').innerHTML = qData.exp;
    document.getElementById('explanation-area').classList.add('show');
    
    const nextBtn = document.getElementById('next-btn');
    if (currentQuestionIndex === questions.length - 1) {
        nextBtn.innerText = "結果を見る";
    } else {
        nextBtn.innerText = "次の問題へ";
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    
    document.getElementById('score-text').innerText = `${score} / 10 点`;
    
    const feedback = document.getElementById('feedback-text');
    if (score === 10) {
        feedback.innerText = "完璧です！この分野のトラップは完全に見抜いていますね。";
        feedback.style.color = "var(--correct)";
    } else if (score >= 7) {
        feedback.innerText = "合格ライン突破！間違えた箇所を復習すればさらに盤石です。";
        feedback.style.color = "var(--primary)";
    } else {
        feedback.innerText = "最初は間違えても大丈夫です！解説を読んでルールやひっかけのパターンを掴みましょう。";
        feedback.style.color = "#ea580c";
    }
}

function retryQuiz() {
    startQuiz(currentCategory);
}

function goHome() {
    document.documentElement.style.setProperty('--bg-color', '#f8fafc'); // 背景リセット
    document.getElementById('home-screen').style.display = 'block';
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
}
</script>
